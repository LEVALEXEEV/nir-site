# Подписи к артефактам анализа (benchmark/analysis/figures, tables).
# Генератор страниц требует подпись для КАЖДОГО рисунка и таблицы: новый
# артефакт без подписи — ошибка сборки, а не молча пропущенная картинка.

figures:
  01_s3_ttfr:
    title: "Рис. 1. Время до первого кадра (S3)"
    text: >-
      Холодная загрузка сцены из 100 статичных объектов, 30 загрузок на
      реализацию. Точка — прогон, ящик — межквартильный размах. R3F стартует
      в 1,3–2,2 раза медленнее на всех платформах.
  02_s1_frame:
    title: "Рис. 2. Время кадра по точкам нагрузки S1"
    text: >-
      Свип по характеру нагрузки: A — заливка, B — вершины, C — число вызовов
      отрисовки, D — исходная сцена НИР2. Штрих — медиана, точки — прогоны.
      Во всех точках, где хватает точности, R3F ref и three.js равны в пределах ±5%.
  03_s2_frame:
    title: "Рис. 3. S2: типичное время кадра и редкие долгие кадры"
    text: >-
      3000 анимируемых объектов. Сверху — медиана времени кадра, снизу — p99;
      логарифмическая шкала, пунктир — бюджеты 60 и 30 FPS. Вариант state
      (setState каждый кадр) в 2,7–3 раза медленнее, parent-state даёт хвост p99.
  03_s2_timeseries:
    title: "Рис. 4. Покадровый ряд, 2 секунды одного прогона (Apple M4 · Chrome)"
    text: >-
      Пики у parent-state повторяются каждые 0,5 с — при каждом изменении
      state над Canvas React перерисовывает всё дерево сцены.
  04_s4_phases:
    title: "Рис. 5. Задержка отклика на клик по фазам (S4)"
    text: >-
      Медианы фаз queue → dispatch → frame_wait → render; их сумма равна
      задержке от события до конца отрисовки кадра с подсветкой. setState на
      клик удлиняет обработчик (dispatch) в 15–25 раз.
  05_s5_fps:
    title: "Рис. 6. Зависимость FPS от числа объектов (S5)"
    text: >-
      Свип N по сетке ×√2 от 100 до 51 200 объектов, обе оси логарифмические.
      Кривые three.js, R3F ref и ref-central почти совпадают; state выходит за
      бюджет при в 2,5–4 раза меньшем числе объектов.
  07_summary:
    title: "Рис. 7. Сводка: во сколько раз вариант R3F отличается от three.js"
    text: >-
      Отношение медиан по сценариям и платформам. Синий — лучше three.js,
      красный — хуже (насыщение на ×2); цвет показывает величину, а не значимость.

tables:
  00_runs:
    title: "Таблица 0. Число прогонов по платформам и сценариям"
    text: Прогоны основной серии, вошедшие в анализ (без прогрева и контрольных прогонов).
  01_bundle:
    title: "Таблица 1. Размер production-сборки"
    text: Размер JavaScript-бандла без сжатия, с gzip и brotli; последняя строка — отношение R3F к three.js.
  01_s3_table:
    title: "Таблица 2. Холодный старт (S3): медианы по прогонам"
    text: Время до первого кадра и его составляющие, память JS к первому кадру, TBT (в Firefox не измеряется).
  01_s3_compare:
    title: "Таблица 3. Холодный старт (S3): сравнение с three.js"
    text: Отношение медиан с 95% доверительным интервалом (бутстрап), p-значение Манна–Уитни с поправкой Холма и вывод.
  02_s1_table:
    title: "Таблица 4. S1: время кадра и GPU-время по точкам нагрузки"
    text: GPU / кадр > 1 — узкое место в видеокарте (кадры конвейеризованы), < 1 — в процессоре. Firefox не даёт таймер GPU и в таблицу не входит.
  02_s1_compare:
    title: "Таблица 5. S1: сравнение времени кадра с three.js"
    text: По точкам нагрузки A–D на каждой платформе.
  03_s2_table:
    title: "Таблица 6. S2: показатели кадра по вариантам"
    text: Медианы по прогонам; «обновление сцены» — фаза update внутри кадра.
  03_s2_compare:
    title: "Таблица 7. S2: сравнение вариантов R3F с three.js"
    text: Медиана, p99 и СКО времени кадра.
  04_s4_table:
    title: "Таблица 8. S4: задержка отклика на клик"
    text: apply — часть dispatch от попадания в объект до применения изменения, собственная стоимость способа обновления.
  04_s4_compare:
    title: "Таблица 9. S4: сравнение медианной задержки с three.js"
    text: Задержка от события ввода до конца отрисовки кадра с подсветкой.
  05_s5_table:
    title: "Таблица 10. S5: ёмкость сцены"
    text: Число объектов, при котором кадр достигает 16,7 мс (60 FPS) и 33,3 мс (30 FPS); интерполяция между уровнями свипа.
  05_s5_compare:
    title: "Таблица 11. S5: сравнение ёмкости при 60 FPS с three.js"
    text: Для ёмкости больше — лучше.
  06_hypotheses:
    title: "Таблица 12. Проверка гипотез H1–H3"
    text: "H1 — равенство при нагрузке на GPU; H2 — устойчивость кадра у R3F ref; H3 — более долгий старт и больший бандл у R3F."
  07_summary:
    title: "Таблица 13. Сводная матрица отношений к three.js"
    text: Числа, по которым построен рис. 7.
